name: Rust foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate texture catalog
        run: python3 scripts/validate_material_catalog.py
      - name: Run unit tests
        run: cargo test --all-targets

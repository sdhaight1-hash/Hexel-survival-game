name: Rust foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Validate texture catalog
        run: python3 scripts/validate_material_catalog.py
      - name: Validate flora research registry
        run: python3 scripts/validate_flora_registry.py
      - name: Validate production material v2 registry
        run: cargo run --quiet --bin material-baker -- validate
      - name: Bake actual v2 candidate art
        run: cargo run --quiet --bin material-baker -- bake
      - name: Run unit tests against baked candidate art
        run: cargo test --all-targets

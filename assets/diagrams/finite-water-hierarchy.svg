<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="825" viewBox="0 0 1280 825" role="img" aria-labelledby="title desc"><title id="title">FINITE WATER: ONE INVENTORY</title><desc id="desc">Hybrid multiscale design  /  Planned hydrology: no water solver currently implemented</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121b21"/><stop offset="1" stop-color="#273943"/></linearGradient><pattern id="grain" width="48" height="48" patternUnits="userSpaceOnUse"><circle cx="3" cy="4" r="1" fill="#d8c69d" opacity=".08"/></pattern><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 2L10 6L1 10" fill="none" stroke="#83b9ab" stroke-width="2"/></marker></defs><rect width="1280" height="825" fill="url(#bg)"/><rect width="1280" height="825" fill="url(#grain)"/><path d="M40 119H1240" stroke="#d7a66d" stroke-width="2" opacity=".55"/><text x="46" y="61" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="39" font-weight="700" fill="#f2ddbd">FINITE WATER: ONE INVENTORY</text><text x="48" y="94" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="18" font-weight="400" fill="#c5d7d0">Hybrid multiscale design  /  Planned hydrology: no water solver currently implemented</text><rect x="45" y="151" width="1188" height="144" rx="20" fill="#202f36" stroke="#d8ad76" stroke-width="2" stroke-opacity=".65"/><text x="67" y="184" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="700" fill="#d8ad76">GLOBAL / CONSERVED MASS</text><text x="67" y="221" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="25" font-weight="700" fill="#f2ddbd">Planetary water ledger</text><text x="67" y="252" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="400" fill="#d4dfd9">Oceans, atmosphere, clouds, snow, ice, organisms and stored water</text><text x="67" y="277" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="400" fill="#d4dfd9">Evaporation, precipitation and freezing are transfers, never sources</text><g><path d="M400 295V341" fill="none" stroke="#83b9ab" stroke-width="3" marker-end="url(#arr)"/><path d="M880 341V295" fill="none" stroke="#83b9ab" stroke-width="3" marker-end="url(#arr)"/></g><text x="640" y="329" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#a9cfc1">BALANCED EXCHANGES</text><rect x="45" y="351" width="1188" height="145" rx="20" fill="#202f36" stroke="#8fbdac" stroke-width="2" stroke-opacity=".65"/><text x="67" y="384" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="700" fill="#8fbdac">REGIONAL / STORAGE &amp; ROUTING</text><text x="67" y="421" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="25" font-weight="700" fill="#f2ddbd">Lakes · river reaches · basins · aquifers</text><text x="67" y="452" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="400" fill="#d4dfd9">Flood and drain by real volume, elevation, head and passage capacity</text><text x="67" y="477" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="400" fill="#d4dfd9">Depression hierarchy can fill, spill or merge; channels may be cached</text><path d="M400 497V544" fill="none" stroke="#83b9ab" stroke-width="3" marker-end="url(#arr)"/><path d="M880 544V497" fill="none" stroke="#83b9ab" stroke-width="3" marker-end="url(#arr)"/><text x="640" y="530" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="16" font-weight="700" fill="#a9cfc1">BALANCED BOUNDARIES</text><rect x="45" y="553" width="1188" height="135" rx="20" fill="#202f36" stroke="#86afd6" stroke-width="2" stroke-opacity=".65"/><text x="67" y="586" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="700" fill="#86afd6">LOCAL / ACTIVE HEXELS</text><text x="67" y="623" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="25" font-weight="700" fill="#f2ddbd">Face-to-face conservative flux</text><text x="67" y="654" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="400" fill="#d4dfd9">Water moves through open connections according to height / pressure</text><text x="67" y="679" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="17" font-weight="400" fill="#d4dfd9">Dams, pumps, newly cut passages and exposed faces update local state</text><rect x="45" y="708" width="1188" height="96" rx="20" fill="#2e3639" stroke="#d9a86d" stroke-width="2" stroke-opacity=".65"/><text x="71" y="741" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="18" font-weight="700" fill="#f0c996">CONSERVATION INVARIANT</text><text x="71" y="773" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="20" font-weight="600" fill="#e7ede5">Every accepted internal transfer = donor loses q; recipient gains q.</text><text x="70" y="795" font-family="Arial,Helvetica,sans-serif" text-anchor="start" font-size="15" font-weight="400" fill="#c3d0c8">SCA may propose underground channel geometry. It does NOT level or create water.</text></svg>
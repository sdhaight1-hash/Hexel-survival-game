<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="830" viewBox="0 0 1280 830" role="img" aria-labelledby="title desc"><title id="title">SPATIAL GROWTH: SHARED, NOT UNIVERSAL</title><desc id="desc">Research architecture  /  SCA headless prototype exists only on draft PR #30</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a20"/><stop offset="1" stop-color="#263741"/></linearGradient><pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c7c3af" opacity=".07"/></pattern><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto-start-reverse"><path d="M1 2 L10 6 L1 10" fill="none" stroke="#83b9ab" stroke-width="2.2"/></marker></defs><rect width="1280" height="830" fill="url(#bg)"/><rect width="1280" height="830" fill="url(#grain)"/><path d="M40 118 H1240" stroke="#d7a66d" stroke-width="2" opacity=".55"/><text x="46" y="59" fill="#f2ddbd" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" text-anchor="start">SPATIAL GROWTH: SHARED, NOT UNIVERSAL</text><text x="48" y="92" fill="#c5d7d0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Research architecture  /  SCA headless prototype exists only on draft PR #30</text><rect x="40" y="147" width="330" height="180" rx="18" fill="#202e35" stroke="#d7a66d" stroke-opacity=".44" stroke-width="2"/><text x="64" y="183" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">INPUT CONSTRAINTS</text><text x="64" y="219" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Root(s) and ordered attractors</text><text x="64" y="247" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Allowed volumes and obstacles</text><text x="64" y="275" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Influence / step / kill limits</text><text x="64" y="303" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Stable feature seed and budget</text><rect x="910" y="147" width="330" height="180" rx="18" fill="#202e35" stroke="#d7a66d" stroke-opacity=".44" stroke-width="2"/><text x="936" y="183" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" text-anchor="start">REUSABLE OUTPUT</text><text x="936" y="219" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Parent-linked spatial edges</text><text x="936" y="247" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Connected skeleton geometry</text><text x="936" y="275" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Deterministic bounded result</text><text x="936" y="303" fill="#d5e0d7" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">No baked material or physics</text><rect x="405" y="148" width="470" height="346" rx="18" fill="#1e3038" stroke="#78bbaa" stroke-opacity=".44" stroke-width="2"/><text x="640" y="191" fill="#f0d0a0" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" text-anchor="middle">SPACE COLONIZATION</text><text x="640" y="218" fill="#bcd4c8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="middle">one optional growth strategy</text><g stroke="#9bcbb1" stroke-width="5" stroke-linecap="round" fill="none"><path d="M628 465 L628 406 L588 345 L548 299"/><path d="M628 406 L690 345 L740 289"/><path d="M588 345 L607 289 L620 247"/><path d="M690 345 L675 292 L666 252"/><path d="M548 299 L500 260"/><path d="M740 289 L778 242"/></g><circle cx="628" cy="465" r="8" fill="#94cdb5" stroke="#15232a" stroke-width="2"/><circle cx="628" cy="406" r="8" fill="#e3b272" stroke="#15232a" stroke-width="2"/><circle cx="588" cy="345" r="8" fill="#94cdb5" stroke="#15232a" stroke-width="2"/><circle cx="548" cy="299" r="8" fill="#e3b272" stroke="#15232a" stroke-width="2"/><circle cx="690" cy="345" r="6" fill="#94cdb5" stroke="#15232a" stroke-width="2"/><circle cx="740" cy="289" r="6" fill="#e3b272" stroke="#15232a" stroke-width="2"/><circle cx="607" cy="289" r="6" fill="#94cdb5" stroke="#15232a" stroke-width="2"/><circle cx="620" cy="247" r="6" fill="#e3b272" stroke="#15232a" stroke-width="2"/><circle cx="675" cy="292" r="6" fill="#94cdb5" stroke="#15232a" stroke-width="2"/><circle cx="666" cy="252" r="6" fill="#e3b272" stroke="#15232a" stroke-width="2"/><circle cx="500" cy="260" r="6" fill="#94cdb5" stroke="#15232a" stroke-width="2"/><circle cx="778" cy="242" r="6" fill="#e3b272" stroke="#15232a" stroke-width="2"/><path d="M370 248 L400 248" stroke="#83b9ab" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><path d="M879 248 L906 248" stroke="#83b9ab" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><text x="640" y="479" fill="#c4d2cc" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="middle">Skeleton ≠ organism, vein, cave or river</text><text x="42" y="552" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">DOMAIN SYSTEMS INTERPRET THE SAME GEOMETRY DIFFERENTLY</text><rect x="40" y="578" width="280" height="134" rx="18" fill="#202e35" stroke="#799b94" stroke-opacity=".44" stroke-width="2"/><text x="56" y="617" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">FLORA</text><text x="56" y="649" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Branches · roots · vines</text><text x="56" y="674" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">species and harvest authority</text><rect x="347" y="578" width="280" height="134" rx="18" fill="#202e35" stroke="#799b94" stroke-opacity=".44" stroke-width="2"/><text x="363" y="617" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">GEOLOGY</text><text x="363" y="649" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Ore veins · fractures</text><text x="363" y="674" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">host and grade authority</text><rect x="654" y="578" width="280" height="134" rx="18" fill="#202e35" stroke="#799b94" stroke-opacity=".44" stroke-width="2"/><text x="670" y="617" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">CAVES / WATERWAYS</text><text x="670" y="649" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Tributaries · conduits</text><text x="670" y="674" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">clearance and hydraulic rules</text><rect x="961" y="578" width="280" height="134" rx="18" fill="#202e35" stroke="#799b94" stroke-opacity=".44" stroke-width="2"/><text x="977" y="617" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" text-anchor="start">SURFACE PATTERNS</text><text x="977" y="649" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">Cracks · filaments</text><text x="977" y="674" fill="#d4deda" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" text-anchor="start">cover and render rules</text><rect x="40" y="741" width="1200" height="62" rx="18" fill="#293237" stroke="#9d735e" stroke-opacity=".44" stroke-width="2"/><text x="70" y="779" fill="#ecc18d" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">NOT A UNIVERSAL SIMULATOR</text><text x="425" y="779" fill="#e4e6dd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">No fluid pressure · no ore inventory · no ecology · no cave traversability</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="806" viewBox="0 0 1280 806" role="img" aria-labelledby="title desc"><title id="title">MATERIALS + OVERLAYS</title><desc id="desc">Design contract  /  P0–P2.2 are narrow gallery prototypes; world-space masks are planned</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a20"/><stop offset="1" stop-color="#263741"/></linearGradient><pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#c7c3af" opacity=".07"/></pattern><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto-start-reverse"><path d="M1 2 L10 6 L1 10" fill="none" stroke="#83b9ab" stroke-width="2.2"/></marker></defs><rect width="1280" height="806" fill="url(#bg)"/><rect width="1280" height="806" fill="url(#grain)"/><path d="M40 118 H1240" stroke="#d7a66d" stroke-width="2" opacity=".55"/><text x="46" y="59" fill="#f2ddbd" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="700" text-anchor="start">MATERIALS + OVERLAYS</text><text x="48" y="92" fill="#c5d7d0" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Design contract  /  P0–P2.2 are narrow gallery prototypes; world-space masks are planned</text><rect x="38" y="156" width="284" height="154" rx="18" fill="#202e35" stroke="#d7a66d" stroke-opacity=".44" stroke-width="2"/><text x="58" y="189" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">01  BASE MATERIAL</text><text x="58" y="223" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Granite / shale / soil</text><text x="58" y="249" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Tileable material identity</text><text x="58" y="275" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Per-face physical UV scale</text><rect x="345" y="156" width="284" height="154" rx="18" fill="#202e35" stroke="#d7a66d" stroke-opacity=".44" stroke-width="2"/><text x="365" y="189" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">02  FEATURE FIELD</text><text x="365" y="223" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Deposit ID + host eligibility</text><text x="365" y="249" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Optional spline / SCA skeleton</text><text x="365" y="275" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Bounded 3D coverage field</text><rect x="652" y="156" width="284" height="154" rx="18" fill="#202e35" stroke="#d7a66d" stroke-opacity=".44" stroke-width="2"/><text x="672" y="189" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">03  CONDITIONS</text><text x="672" y="223" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Wetness, moss, frost, snow</text><text x="672" y="249" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">State supplied independently</text><text x="672" y="275" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Masks can conceal exposed ore</text><rect x="959" y="156" width="284" height="154" rx="18" fill="#202e35" stroke="#d7a66d" stroke-opacity=".44" stroke-width="2"/><text x="979" y="189" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" text-anchor="start">04  SHADING</text><text x="979" y="223" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Copper: limited metal glints</text><text x="979" y="249" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Other minerals: own response</text><text x="979" y="275" fill="#d7dfda" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Composited appearance only</text><path d="M488 313 L488 355" stroke="#83b9ab" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><path d="M795 313 L795 355" stroke="#83b9ab" stroke-width="3" stroke-linecap="round" fill="none" marker-end="url(#arr)"/><rect x="40" y="358" width="1200" height="312" rx="18" fill="#1c2a31" stroke="#608e90" stroke-opacity=".44" stroke-width="2"/><text x="74" y="393" fill="#e7d2ac" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" text-anchor="start">ONE CONTINUOUS FEATURE · MANY EXPOSED FACES</text><text x="74" y="422" fill="#c3d1cd" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">Plan view: a vein crosses adjacent regular hexagon caps without restarting per cell.</text><polygon points="249.76,575.50 190.00,610.00 130.24,575.50 130.24,506.50 190.00,472.00 249.76,506.50" fill="#35444b" stroke="#739196" stroke-width="2.5"/><polygon points="364.76,575.50 305.00,610.00 245.24,575.50 245.24,506.50 305.00,472.00 364.76,506.50" fill="#43525a" stroke="#739196" stroke-width="2.5"/><polygon points="479.76,575.50 420.00,610.00 360.24,575.50 360.24,506.50 420.00,472.00 479.76,506.50" fill="#35444b" stroke="#739196" stroke-width="2.5"/><polygon points="594.76,575.50 535.00,610.00 475.24,575.50 475.24,506.50 535.00,472.00 594.76,506.50" fill="#43525a" stroke="#739196" stroke-width="2.5"/><polygon points="709.76,575.50 650.00,610.00 590.24,575.50 590.24,506.50 650.00,472.00 709.76,506.50" fill="#35444b" stroke="#739196" stroke-width="2.5"/><path d="M113 566 C180 529 216 572 280 546 S390 517 451 542 S563 572 620 527 S704 530 740 547" fill="none" stroke="#593a2e" stroke-width="21" stroke-linecap="round" opacity=".9"/><path d="M113 566 C180 529 216 572 280 546 S390 517 451 542 S563 572 620 527 S704 530 740 547" fill="none" stroke="#dfa36b" stroke-width="9" stroke-linecap="round"/><path d="M113 566 C180 529 216 572 280 546 S390 517 451 542 S563 572 620 527 S704 530 740 547" fill="none" stroke="#ffe0a1" stroke-width="2" stroke-dasharray="6 14"/><text x="803" y="500" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start">SHARED FEATURE SPACE</text><text x="803" y="535" fill="#d2ded8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Same seed and feature ID</text><text x="803" y="566" fill="#d2ded8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Same host-rock authorization</text><text x="803" y="597" fill="#d2ded8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">Same pattern after mesh rebuild</text><text x="803" y="628" fill="#d2ded8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start">No resource stock from pixels</text><path d="M746 539 H790" stroke="#dfa36b" stroke-width="2" stroke-dasharray="6 6"/><rect x="40" y="690" width="1200" height="88" rx="18" fill="#2c3436" stroke="#d5a16b" stroke-opacity=".44" stroke-width="2"/><text x="74" y="727" fill="#f0c996" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" text-anchor="start">INVARIANT</text><text x="210" y="728" fill="#ecede6" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="600" text-anchor="start">Host identity · Ore grade · Remaining quantity · Player edits</text><text x="210" y="754" fill="#bcd1ca" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start">are authoritative data; overlays and glints only visualize them.</text></svg>
[package]
name = "hexel-survival-game"
version = "0.1.0"
edition = "2021"
publish = false
default-run = "hexel-survival-game"
description = "Foundational Rust survival game with a first-person hexel chunk prototype"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
pollster = "0.4"
png = "0.17"
bcdec_rs = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
texture-compressor = "0.2"
wgpu = "24"
winit = "0.30"

[dev-dependencies]
# Already pulled by wgpu; validate WGSL before a user launches the GPU renderer.
naga = { version = "24", features = ["wgsl-in"] }

[build-dependencies]
png = "0.17"
bcdec_rs = "0.2"
texture-compressor = "0.2"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hexel-survival-game"
path = "src/main.rs"
